<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Coding time stats are not available.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .blob { animation: drift 19s ease-in-out infinite alternate; }
    .blob1 { animation-duration: 23s; animation-direction: alternate-reverse; }
    .blob2 { animation-duration: 29s; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(70px, 26px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="56"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath>
    <linearGradient id="edge" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="#eef2f8"/>
    <g filter="url(#soften)" opacity="0.75">
      <circle class="blob blob0" cx="120" cy="40" r="150" fill="#60a5fa"/>
      <circle class="blob blob1" cx="820" cy="280" r="160" fill="#c4b5fd"/>
      <circle class="blob blob2" cx="520" cy="300" r="110" fill="#67e8f9"/>
    </g>
    <rect width="900" height="300" filter="url(#grain)" opacity="0.05"/>
  </g>
  <g>
    <rect x="12" y="12" width="876" height="276" rx="14" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="12" y="12" width="876" height="276" rx="14" fill="url(#sheen)"/>
    <rect x="12.5" y="12.5" width="875" height="275" rx="13.5" fill="none" stroke="url(#edge)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="none" stroke="#0f172a" stroke-opacity="0.09"/>
  <text x="28" y="42" class="mono" font-size="11" letter-spacing="1.5" fill="#2563eb">CODING TIME · LAST 7 DAYS</text>
  <text x="28" y="96" class="sans" font-size="15" fill="#526071">Coding stats are not available right now.</text>
  <text x="28" y="282" class="mono" font-size="10" fill="#526071">Updated 24 Oct 2026</text>
</svg>
