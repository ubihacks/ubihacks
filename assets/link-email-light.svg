<svg xmlns="http://www.w3.org/2000/svg" width="300" height="68" viewBox="0 0 300 68" role="img" aria-label="Email: ubaidifti@gmail.com">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .blob { animation: drift 19s ease-in-out infinite alternate; }
    .blob1 { animation-duration: 23s; animation-direction: alternate-reverse; }
    .blob2 { animation-duration: 29s; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(70px, 26px); } }
    .sweep { animation: sweep 9s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 1.2s; }
    @keyframes sweep { 0% { transform: translateX(0); } 22%, 100% { transform: translateX(360px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sweep { display: none; } }
  </style>
  <defs>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="56"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="card"><rect width="220" height="48" rx="18"/></clipPath>
    <linearGradient id="edge" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="insta" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/><stop offset="0.3" stop-color="#fa7e1e"/>
      <stop offset="0.6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(80 10)">
  <g clip-path="url(#card)">
    <rect width="220" height="48" fill="#eef2f8"/>
    <g filter="url(#soften)" opacity="0.75">
      <circle class="blob blob0" cx="100" cy="0" r="60" fill="#60a5fa"/>
      <circle class="blob blob1" cx="190" cy="48" r="70" fill="#c4b5fd"/>
    </g>
    <rect width="220" height="48" filter="url(#grain)" opacity="0.05"/>
  </g>
  <g>
    <rect x="0" y="0" width="220" height="48" rx="18" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="0" y="0" width="220" height="48" rx="18" fill="url(#sheen)"/>
    <rect x="0.5" y="0.5" width="219" height="47" rx="17.5" fill="none" stroke="url(#edge)"/>
  </g>

  <g clip-path="url(#card)"><rect class="sweep" x="-100" y="-10" width="44" height="68" fill="url(#shine)" transform="skewX(-20)"/></g>

  <g transform="translate(10 10) scale(0.7777777777777778)"><rect x="0" y="0" width="36" height="36" rx="10" fill="url(#mail)"/>
    <rect x="8.5" y="11.5" width="19" height="13" rx="2.5" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/>
    <path d="M9.5 13 L18 19.2 L26.5 13" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></g>
  <text x="48" y="22" class="sans" font-size="12.5" font-weight="600" fill="#0f172a">Email</text>
  <text x="48" y="36" class="mono" font-size="10" fill="#526071">ubaidifti@gmail.com</text>
  <path d="M200 20 L206 14 M201 14 H206 V19" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="0.5" y="0.5" width="219" height="47" rx="18" fill="none" stroke="#0f172a" stroke-opacity="0.09"/>
  </g>
</svg>
